services:
  # --- ZONE: INTERNET ---
  inet-client-01:
    container_name: inet-client-01
    image: alpine:latest
    hostname: inet-client-01
    tty: true
    cap_add: [ NET_ADMIN ]
    networks:
      internet_net:
        ipv4_address: 10.0.10.10
    command: >
      sh -c "
        apk update && 
        apk add --no-cache nmap curl nikto perl && 
        ln -s /usr/bin/nikto.pl /usr/bin/nikto && 
        ip route del default && 
        ip route add default via 10.0.10.254 && 
        tail -f /dev/null
      "

  # --- EXTERNAL HONEYPOT: DIONAEA ---
  inet-dionaea-01:
    container_name: inet-dionaea-01
    image: dinotools/dionaea
    hostname: inet-dionaea-01
    restart: always
    networks:
      internet_net:
        ipv4_address: 10.0.10.20

  # --- EDGE FIREWALL (EXTERNAL) ---
  fw-edge-01:
    container_name: fw-edge-01
    image: alpine:latest
    hostname: fw-edge-01
    cap_add: [ NET_ADMIN ]
    ports:
      - "8000:80"
      - "8080:8080"
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      internet_net:
        ipv4_address: 10.0.10.254
      dmz_net:
        ipv4_address: 10.0.20.254
    command: >
      sh -c "
        apk add --no-cache iptables &&
        iptables -P FORWARD DROP &&
        iptables -A FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT &&
        iptables -A FORWARD -p tcp --dport 80 -j ACCEPT &&
        iptables -t nat -A PREROUTING -p tcp --dport 80 -j DNAT --to-destination 10.0.20.10:80 &&
        iptables -A FORWARD -p tcp --dport 8080 -j ACCEPT &&
        iptables -t nat -A PREROUTING -p tcp --dport 8080 -j DNAT --to-destination 10.0.20.22:8080 &&
        iptables -t nat -A POSTROUTING -j MASQUERADE &&
        tail -f /dev/null
      "

  # --- ZONE: DMZ ---
  dmz-web-01:
    container_name: dmz-web-01
    build: ./WebApp
    hostname: dmz-web-01
    tty: true
    cap_add: [ NET_ADMIN ]
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - FLASK_DEBUG=1
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
    volumes:
      - ./WebApp:/app
    networks:
      dmz_net:
        ipv4_address: 10.0.20.10
    command: >
      sh -c "
        ip route del default && 
        ip route add default via 10.0.20.254 &&
        ip route add 10.0.30.0/24 via 10.0.20.253 &&
        flask run --host=0.0.0.0 --port=80 --debug
      "
    depends_on:
      - int-db-01

  dmz-tanner-01:
    container_name: dmz-tanner-01
    build: ./Tanner
    hostname: dmz-tanner-01
    tty: true
    networks:
      dmz_net:
        ipv4_address: 10.0.20.21

  dmz-snare-01:
    container_name: dmz-snare-01
    build: ./Snare
    hostname: dmz-snare-01
    tty: true
    networks:
      dmz_net:
        ipv4_address: 10.0.20.22
    depends_on:
      - dmz-tanner-01
      - dmz-web-01

  # --- INTERNAL FIREWALL ---
  fw-internal-01:
    container_name: fw-internal-01
    image: alpine:latest
    hostname: fw-internal-01
    cap_add: [ NET_ADMIN ]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      dmz_net:
        ipv4_address: 10.0.20.253
      internal_net:
        ipv4_address: 10.0.30.254
    command: >
      sh -c "
        apk add --no-cache iptables &&
        iptables -P FORWARD DROP &&
        iptables -A FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT &&
        iptables -A FORWARD -s 10.0.20.0/24 -d 10.0.30.0/24 -p tcp --dport 5432 -j ACCEPT &&
        tail -f /dev/null
      "

  # --- ZONE: INTERNAL ---
  int-db-01:
    container_name: int-db-01
    image: postgres:15-alpine
    hostname: int-db-01
    tty: true
    cap_add: [ NET_ADMIN ]
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    networks:
      internal_net:
        ipv4_address: 10.0.30.10
    volumes:
      - ./WebApp/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    command: >
      sh -c "
        ip route del default 2>/dev/null;
        ip route add default via 10.0.30.254 &&
        docker-entrypoint.sh postgres
      "

  # --- INTERNAL HONEYPOT: KIPPO ---
  int-kippo-01:
    container_name: int-kippo-01
    build: ./Kippo
    hostname: int-kippo-01
    user: root
    tty: true
    cap_add: [ NET_ADMIN ]
    networks:
      internal_net:
        ipv4_address: 10.0.30.20
    command: >
      sh -c "
        ip route del default 2>/dev/null;
        ip route add default via 10.0.30.254 &&
        cd /home/kippo/kippo && su kippo -c './start.sh'
      "

networks:
  internet_net:
    driver: bridge
    ipam: { config: [ { subnet: 10.0.10.0/24 } ] }
  dmz_net:
    driver: bridge
    ipam: { config: [ { subnet: 10.0.20.0/24 } ] }
  internal_net:
    driver: bridge
    internal: true
    ipam: { config: [ { subnet: 10.0.30.0/24 } ] }

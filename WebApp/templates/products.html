{% extends 'base.html' %}

{% block content %}
<section class="container products-section" id="solutions">
    <span class="section-title">CURRENT SOLUTIONS</span>
    <div class="grid">
        {% for product in products %}
        <div class="product-card reveal">
            <a href="/product/{{ product.id }}">
                <div class="product-image-container">
                    <img src="{{ product.image_url }}" alt="{{ product.name }}" class="product-image">
                </div>
                <div class="product-info">
                    <h3>{{ product.name }}</h3>
                    <p>{{ product.description }}</p>
                    <div class="product-meta">
                        <span class="price">${{ product.price }}</span>
                        <span class="btn btn-outline" style="font-size: 0.7rem; padding: 0.4rem 0.8rem;">VIEW_DETAILS</span>
                    </div>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}

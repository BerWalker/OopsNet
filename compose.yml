services:
  # --- ZONE: INTERNET ---
  inet-client-01:
    container_name: inet-client-01
    image: alpine:latest
    hostname: inet-client-01
    tty: true
    cap_add: [ NET_ADMIN ]
    networks:
      internet_net:
        ipv4_address: 10.0.10.10
    command: sh -c "ip route del default && ip route add default via 10.0.10.254 && tail -f /dev/null"

  # --- EDGE FIREWALL (EXTERNAL) ---
  fw-edge-01:
    container_name: fw-edge-01
    image: alpine:latest
    hostname: fw-edge-01
    cap_add: [ NET_ADMIN ]
    ports:
      - "8000:80"
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      internet_net:
        ipv4_address: 10.0.10.254
      dmz_net:
        ipv4_address: 10.0.20.254
    command: >
      sh -c "
        apk add --no-cache iptables &&
        iptables -P FORWARD DROP &&
        iptables -A FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT &&
        iptables -A FORWARD -p tcp --dport 80 -j ACCEPT &&
        iptables -t nat -A PREROUTING -p tcp --dport 80 -j DNAT --to-destination 10.0.20.10:80 &&
        iptables -t nat -A POSTROUTING -j MASQUERADE &&
        tail -f /dev/null
      "

  # --- ZONE: DMZ ---
  dmz-webserver-01:
    container_name: dmz-webserver-01
    build: ./WebApp
    hostname: dmz-web-01
    tty: true
    cap_add: [ NET_ADMIN ]
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASS}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - FLASK_DEBUG=1
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
    volumes:
      - ./WebApp:/app
    networks:
      dmz_net:
        ipv4_address: 10.0.20.10
    command: >
      sh -c "
        ip route del default && 
        ip route add default via 10.0.20.254 &&
        ip route add 10.0.30.0/24 via 10.0.20.253 &&
        flask run --host=0.0.0.0 --port=80 --debug
      "
    depends_on:
      - int-database-01

  # --- INTERNAL FIREWALL ---
  fw-internal-01:
    container_name: fw-internal-01
    image: alpine:latest
    hostname: fw-internal-01
    cap_add: [ NET_ADMIN ]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      dmz_net:
        ipv4_address: 10.0.20.253
      internal_net:
        ipv4_address: 10.0.30.254
    command: >
      sh -c "
        apk add --no-cache iptables &&
        iptables -P FORWARD DROP &&
        iptables -A FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT &&
        iptables -A FORWARD -s 10.0.20.0/24 -d 10.0.30.0/24 -p tcp --dport 5432 -j ACCEPT &&
        tail -f /dev/null
      "

  # --- ZONE: INTERNAL ---
  int-database-01:
    container_name: int-database-01
    image: postgres:15-alpine
    hostname: int-database-01
    tty: true
    cap_add: [ NET_ADMIN ]
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    networks:
      internal_net:
        ipv4_address: 10.0.30.10
    volumes:
      - ./WebApp/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    command: >
      sh -c "
        ip route del default 2>/dev/null;
        ip route add default via 10.0.30.254 &&
        docker-entrypoint.sh postgres
      "

networks:
  internet_net:
    driver: bridge
    ipam: { config: [ { subnet: 10.0.10.0/24 } ] }
  dmz_net:
    driver: bridge
    ipam: { config: [ { subnet: 10.0.20.0/24 } ] }
  internal_net:
    driver: bridge
    internal: true
    ipam: { config: [ { subnet: 10.0.30.0/24 } ] }

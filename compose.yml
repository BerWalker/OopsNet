services:
  # --- ZONA: INTERNET ---
  inet-client-01:
    container_name: inet-client-01
    image: alpine:latest
    hostname: inet-client-01
    tty: true
    cap_add: [ NET_ADMIN ]
    networks:
      internet_net:
        ipv4_address: 10.0.10.10
    command: sh -c "ip route del default && ip route add default via 10.0.10.254 && tail -f /dev/null"

  # --- FIREWALL DE BORDA (EXTERNO) ---
  fw-edge-01:
    container_name: fw-edge-01
    image: alpine:latest
    hostname: fw-edge-01
    cap_add: [ NET_ADMIN ]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      internet_net:
        ipv4_address: 10.0.10.254
      dmz_net:
        ipv4_address: 10.0.20.254
    command: >
      sh -c "
        apk add --no-cache iptables &&
        iptables -P FORWARD DROP &&
        iptables -A FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT &&
        iptables -A FORWARD -p tcp --dport 80 -j ACCEPT &&
        tail -f /dev/null
      "

  # --- ZONA: DMZ ---
  dmz-webserver-01:
    container_name: dmz-webserver-01
    image: alpine:latest
    hostname: dmz-webserver-01
    tty: true
    cap_add: [ NET_ADMIN ]
    networks:
      dmz_net:
        ipv4_address: 10.0.20.10
    command: >
      sh -c "
        ip route del default && 
        ip route add default via 10.0.20.254 &&
        ip route add 10.0.30.0/24 via 10.0.20.253 &&
        nc -lk -p 80 & 
        tail -f /dev/null
      "

  # --- FIREWALL INTERNO ---
  fw-internal-01:
    container_name: fw-internal-01
    image: alpine:latest
    hostname: fw-internal-01
    cap_add: [ NET_ADMIN ]
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      dmz_net:
        ipv4_address: 10.0.20.253
      internal_net:
        ipv4_address: 10.0.30.254
    command: >
      sh -c "
        apk add --no-cache iptables &&
        iptables -P FORWARD DROP &&
        iptables -A FORWARD -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT &&
        iptables -A FORWARD -s 10.0.20.0/24 -d 10.0.30.0/24 -p tcp --dport 3306 -j ACCEPT &&
        tail -f /dev/null
      "

  # --- ZONA: INTERNA ---
  int-database-01:
    container_name: int-database-01
    image: alpine:latest
    hostname: int-database-01
    tty: true
    cap_add: [ NET_ADMIN ]
    networks:
      internal_net:
        ipv4_address: 10.0.30.10
    command: >
      sh -c "
        ip route del default 2>/dev/null;
        ip route add default via 10.0.30.254 &&
        nc -lk -p 3306 &
        tail -f /dev/null
      "

networks:
  internet_net:
    driver: bridge
    ipam: { config: [ { subnet: 10.0.10.0/24 } ] }
  dmz_net:
    driver: bridge
    ipam: { config: [ { subnet: 10.0.20.0/24 } ] }
  internal_net:
    driver: bridge
    internal: true
    ipam: { config: [ { subnet: 10.0.30.0/24 } ] }
